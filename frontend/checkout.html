<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Secure FixerUpper checkout."><title>Secure Checkout | FixerUpper</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body data-page="checkout">
  <nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark"><i class="bi bi-tools"></i></span> FixerUpper</a><div class="checkout-secure"><i class="bi bi-lock-fill"></i> Secure checkout</div></div></nav>
  <main><header class="page-hero compact"><div class="container"><span class="eyebrow">Almost there</span><h1>Confirm your order</h1></div></header><section class="section-space"><div class="container"><div id="checkout-loading" class="loading-state"><div class="spinner-border text-warning" role="status"><span class="visually-hidden">Checking your session</span></div><span>Preparing secure checkout…</span></div><div id="checkout-alert"></div><div id="checkout-content" class="row g-4 d-none"><div class="col-lg-7"><div class="checkout-panel"><h2><span>1</span> Shipping details</h2><form id="checkout-form" novalidate><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" maxlength="100" autocomplete="name" required></div><div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" maxlength="190" autocomplete="email" required></div><div class="col-md-6"><label class="form-label" for="phone">Phone</label><input class="form-control" id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel" required></div><div class="col-md-6"><label class="form-label" for="postal-code">Postal code</label><input class="form-control" id="postal-code" name="postal_code" maxlength="20" autocomplete="postal-code" required></div><div class="col-12"><label class="form-label" for="address">Street address</label><input class="form-control" id="address" name="address" maxlength="255" autocomplete="street-address" required></div><div class="col-12"><label class="form-label" for="city">City</label><input class="form-control" id="city" name="city" maxlength="100" autocomplete="address-level2" required></div></div><div class="checkout-assurance"><i class="bi bi-shield-check"></i><div><strong>Your details are protected</strong><span>Orders are validated securely by the server.</span></div></div><button class="btn btn-warning btn-lg w-100" type="submit" id="place-order-button"><span class="button-label">Confirm order</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span><i class="bi bi-lock-fill"></i></button></form></div></div><div class="col-lg-5"><aside class="order-summary checkout-summary"><h2>Order summary</h2><div id="checkout-items"></div><hr><div class="summary-row"><span>Subtotal</span><strong id="checkout-subtotal">$0.00</strong></div><div class="summary-row"><span>Shipping</span><strong class="text-success">Free</strong></div><div class="summary-row total"><span>Total</span><strong id="checkout-total">$0.00</strong></div><a href="cart.html" class="continue-link"><i class="bi bi-pencil"></i> Edit cart</a></aside></div></div></div></section></main>
  <footer class="site-footer"><div class="container justify-content-center d-flex"><p class="mb-0"><i class="bi bi-shield-lock"></i> Secure FixerUpper checkout</p></div></footer><div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/cart.js"></script><script src="js/checkout.js"></script>
</body>
</html>
