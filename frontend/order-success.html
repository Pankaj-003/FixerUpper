<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Your FixerUpper order is confirmed."><title>Order Confirmed | FixerUpper</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body data-page="success" class="success-page">
  <nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark"><i class="bi bi-tools"></i></span> FixerUpper</a><button class="btn btn-outline-light btn-sm" data-logout>Logout</button></div></nav>
  <main class="success-main"><div class="container"><div class="success-card"><div class="success-check"><i class="bi bi-check-lg"></i></div><span class="eyebrow dark">Order confirmed</span><h1>Nice work. Your tools are booked.</h1><p>We’ve received your order and it is now being prepared.</p><div class="order-confirmation"><div><span>Order number</span><strong id="success-order-number">—</strong></div><div><span>Order total</span><strong id="success-total">—</strong></div></div><div class="success-note"><i class="bi bi-envelope-check"></i><p><strong>What happens next?</strong><br>Your confirmed order is saved to your account. Keep the order number for reference.</p></div><div class="d-flex flex-column flex-sm-row gap-3 justify-content-center"><a href="products.html" class="btn btn-warning btn-lg">Continue shopping</a><a href="index.html" class="btn btn-outline-dark btn-lg">Back to home</a></div></div></div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/logout.js"></script><script>window.addEventListener('DOMContentLoaded', () => { const saved = JSON.parse(sessionStorage.getItem('fixerupper_last_order') || 'null'); const params = new URLSearchParams(location.search); const number = saved?.order_number || params.get('order'); const total = saved?.total_amount || params.get('total'); document.getElementById('success-order-number').textContent = number || 'Confirmed'; document.getElementById('success-total').textContent = total ? window.FixerUpper.formatCurrency(total) : 'Confirmed'; });</script>
</body>
</html>
