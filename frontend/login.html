<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Log in securely to FixerUpper."><title>Login | FixerUpper</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body data-page="login" class="auth-page">
  <nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark"><i class="bi bi-tools"></i></span> FixerUpper</a><a href="cart.html" class="nav-link cart-link text-white"><i class="bi bi-cart3"></i> Cart <span class="cart-count">0</span></a></div></nav>
  <main class="auth-main"><div class="container"><div class="auth-card"><div class="auth-icon"><i class="bi bi-shield-lock"></i></div><span class="eyebrow dark">Secure account access</span><h1>Welcome back</h1><p>Log in to confirm your order and view your purchases.</p><div id="form-alert"></div><form id="login-form" novalidate><div class="mb-3"><label class="form-label" for="email">Email address</label><div class="input-icon"><i class="bi bi-envelope"></i><input class="form-control" id="email" name="email" type="email" autocomplete="email" maxlength="190" required></div><div class="invalid-feedback">Enter a valid email address.</div></div><div class="mb-4"><label class="form-label" for="password">Password</label><div class="input-icon"><i class="bi bi-key"></i><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password"><i class="bi bi-eye"></i></button></div><div class="invalid-feedback">Enter your password.</div></div><button class="btn btn-warning btn-lg w-100" type="submit" id="login-button"><span class="button-label">Log in securely</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button></form><p class="auth-switch">New to FixerUpper? <a id="register-link" href="register.html">Create an account</a></p><a href="products.html" class="back-link"><i class="bi bi-arrow-left"></i> Continue shopping</a></div></div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/cart.js"></script><script src="js/login.js"></script>
</body>
</html>
